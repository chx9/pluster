# Configuration with authentication
# Use this when your Redis cluster requires a password,
# and/or you want clients to authenticate with the proxy.

bind 0.0.0.0
port 7777

# Redis cluster entry points
cluster 127.0.0.1:7000
cluster 127.0.0.1:7001
cluster 127.0.0.1:7002

# Redis cluster credentials (for backend connections)
username default
password your-redis-password

# Optional: require clients to authenticate with the proxy
# client-password your-proxy-password

pool-size 20
idle-timeout 30s
refresh-interval 5s
log-level info
