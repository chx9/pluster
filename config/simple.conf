# Simple single-cluster configuration
# Connect to a Redis cluster and proxy it on port 7777

# Proxy listen address and port
bind 0.0.0.0
port 7777

# Redis cluster entry point(s) - add one or more nodes
cluster 127.0.0.1:7000

# Connection pool size per cluster node
pool-size 20

# Idle connection timeout
idle-timeout 30s

# Topology refresh interval
refresh-interval 5s

# Log level: debug, info, warn, error
log-level info
