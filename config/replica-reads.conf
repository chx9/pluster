# Configuration with replica read scaling
# Routes read commands to replica nodes to reduce master load.

bind 0.0.0.0
port 7777

cluster 127.0.0.1:7000
cluster 127.0.0.1:7001
cluster 127.0.0.1:7002

# Read mode options:
#   master-only  - all reads go to master (default, strongest consistency)
#   master-slave - round-robin across master and all slaves
#   slave-only   - prefer slave for reads, fallback to master if none
read-mode master-slave

pool-size 30
idle-timeout 30s
refresh-interval 5s
log-level info

# Limit concurrent client connections (0 = unlimited)
max-clients 1000
